        body {

            font-family: "Courier New", monospace;

            max-width: 64rem;
            margin: 0 auto;
        }

        .examples {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        button {
            background: #171717;
            color: #f5f5f5;
            border: 1px solid #444;
            padding: 0.6rem 1rem;
            font-family: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }
    </style>
</head>

<body>
<main>

    <h2>Foo Editor</h2>

    <div class="examples">
        <button data-example="hello">Hello World</button>
    </div>

    <div id="editor" data-foo-editor data-height="360px"></div>

</main>

<script type="module" src="./editor/auto.js"></script>

<script>
    const examples = {
        hello: `fn main()\n{\n    println("Hello, World!!!!!!")\n}`
    }

    document.querySelectorAll("[data-example]").forEach(button => {
        button.addEventListener("click", () => {
            const editor = window.fooEditors?.get("editor");

            if (!editor) {
                console.error("Editor not mounted yet!");
                return;
            }

            editor.setCode(examples[button.dataset.example]);
        });
    });
</script>

</body>
</html>
